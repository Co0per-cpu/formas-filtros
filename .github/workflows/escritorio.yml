name: App de escritorio (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run prepare-web
      - name: Probar la cámara virtual (Node)
        run: node test-vcam.js
      - run: npm run dist
      - name: Probar la cámara virtual dentro del programa empaquetado
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Select-Object -First 1
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $exe.FullName test-vcam.js dist/win-unpacked/resources/app/vcam.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FormasYFiltros-windows
          path: dist/FormasYFiltros.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio
          name: Formas y Filtros para Windows
          body: Descarga FormasYFiltros.exe y ábrelo con doble clic. No necesita instalación.
          files: dist/FormasYFiltros.exe
