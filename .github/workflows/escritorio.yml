name: App de escritorio (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run prepare-web
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FormasYFiltros-windows
          path: dist/FormasYFiltros.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio
          name: Formas y Filtros para Windows
          body: Descarga FormasYFiltros.exe y ábrelo con doble clic. No necesita instalación.
          files: dist/FormasYFiltros.exe
